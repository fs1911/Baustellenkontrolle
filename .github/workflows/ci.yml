name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Typecheck, Format, Unit-Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  integration-e2e:
    name: RLS-/Integrations- und E2E-Tests
    runs-on: ubuntu-latest
    needs: checks
    services:
      db:
        image: supabase/postgres:15.8.1.085
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      APP_ENV: test
      APP_BASE_URL: http://localhost:3100
      DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      AUTH_PROVIDER: local
      STORAGE_PROVIDER: local
      MAIL_PROVIDER: sandbox
      AI_PROVIDER: rules
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Warten bis Supabase-Postgres initialisiert ist
        run: for i in $(seq 1 30); do psql postgres://postgres:postgres@localhost:54322/postgres -c "select 1 from auth.users limit 1" && break; sleep 2; done
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
